<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi Trân ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        /* Nền hình ảnh hoa ly */
        .bg-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://images.unsplash.com/photo-1588850561407-ed78c282e89b?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            filter: brightness(0.7);
            z-index: -1;
        }

        /* Khung nội dung chính */
        .content-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }

        /* Chữ thông điệp */
        .message {
            color: #ffffff;
            font-size: 3rem;
            font-weight: bold;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.7), 0 0 20px rgba(255, 182, 193, 0.8);
            background: rgba(0, 0, 0, 0.35);
            padding: 30px 50px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: pulse 2s infinite ease-in-out;
            margin-bottom: 20px;
        }

        /* Nút bật/tắt nhạc */
        .music-btn {
            background: rgba(255, 255, 255, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.5);
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 1rem;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }

        .music-btn:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(1.05);
        }

        /* Ẩn hoàn toàn khung YouTube */
        .hidden-player {
            display: none;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }

        @media (max-width: 768px) {
            .message {
                font-size: 1.8rem;
                padding: 20px 30px;
            }
        }
    </style>
</head>
<body>

    <div class="bg-background"></div>

    <div class="content-container">
        <h1 class="message">Yêu bé lắm Trân ạ ❤️</h1>
        <button class="music-btn" onclick="togglePlay()">🎵 Phát / Tắt Nhạc</button>
    </div>

    <iframe 
        id="youtube-player"
        class="hidden-player"
        src="https://www.youtube.com/embed/f-VsoLm4i5c?enablejsapi=1&autoplay=1&loop=1&playlist=f-VsoLm4i5c" 
        allow="autoplay">
    </iframe>

    <script>
        // Xử lý bật/tắt nhạc khi bấm nút
        let isPlaying = true;
        function togglePlay() {
            const iframe = document.getElementById('youtube-player');
            if (isPlaying) {
                iframe.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
            } else {
                iframe.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
            }
            isPlaying = !isPlaying;
        }

        // Tự động phát nhạc ngay khi người dùng chạm/click vào bất kỳ đâu trên trang
        document.addEventListener('click', function() {
            const iframe = document.getElementById('youtube-player');
            iframe.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
        }, { once: true });
    </script>

</body>
</html>
