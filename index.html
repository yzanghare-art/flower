<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi Trân ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        /* Nền hình ảnh hoa ly */
        .bg-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Thay đổi URL bên dưới nếu bạn muốn dùng ảnh hoa ly khác */
            background-image: url('https://images.unsplash.com/photo-1588850561407-ed78c282e89b?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            filter: brightness(0.7); /* Làm tối nền nhẹ để nổi bật chữ */
            z-index: -1;
        }

        /* Khung nội dung chính ở giữa */
        .content-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }

        /* Chữ thông điệp */
        .message {
            color: #ffffff;
            font-size: 3rem;
            font-weight: bold;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.7), 0 0 20px rgba(255, 182, 193, 0.8);
            background: rgba(0, 0, 0, 0.3);
            padding: 30px 50px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: pulse 2s infinite ease-in-out;
        }

        /* Khung chứa nhạc (nhúng từ YouTube) */
        .music-player {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 12px;
            padding: 5px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        /* Hiệu ứng nhịp đập cho chữ */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }

        /* Tối ưu cho màn hình điện thoại */
        @media (max-width: 768px) {
            .message {
                font-size: 1.8rem;
                padding: 20px 30px;
            }
        }
    </style>
</head>
<body>

    <div class="bg-background"></div>

    <div class="content-container">
        <h1 class="message">Yêu bé lắm Trân ạ ❤️</h1>
    </div>

    <div class="music-player">
        <iframe 
            width="280" 
            height="157" 
            src="https://www.youtube.com/embed/f-VsoLm4i5c?autoplay=1" 
            title="Nhạc nền" 
            frameborder="0" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
        </iframe>
    </div>

</body>
</html>
